<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - EzMP3</title>
    
    <!-- Dynamic Favicon SVG Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%2312181f'/><rect x='10' y='10' width='80' height='80' rx='20' fill='%2300F2FE' fill-opacity='0.2'/><path d='M42 32C42 30.4 43.8 29.4 45.1 30.3L67.4 45C68.5 45.8 68.5 47.5 67.4 48.3L45.1 63C43.8 63.9 42 62.9 42 61.3V32Z' fill='%23FF0844'/><rect x='24' y='42' width='4' height='16' rx='2' fill='%2300F2FE'/><rect x='31' y='34' width='4' height='32' rx='2' fill='%2300F2FE'/><rect x='72' y='40' width='4' height='20' rx='2' fill='%234FACFE'/></svg>">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #d1d5db;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Header Navigation */
        header {
            width: 100%;
            max-width: 760px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .header-logo:hover {
            opacity: 0.85;
        }

        .header-logo-text {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #00F2FE 0%, #4FACFE 50%, #FF0844 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        nav a {
            color: #9ca3af;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #38bdf8;
        }

        /* Page Title Section */
        .page-header {
            margin: 30px 0 20px 0;
            text-align: center;
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 14px;
            color: #94a3b8;
        }

        /* Form Container Card */
        .container {
            width: 90%;
            max-width: 650px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            font-size: 14px;
            color: #f8fafc;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.4);
        }

        /* Success Message Box */
        .success-box {
            display: none;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #34d399;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }

        footer {
            margin-top: auto;
            display: flex;
            gap: 20px;
            font-size: 13px;
        }

        footer a {
            color: #64748b;
            text-decoration: none;
        }

        footer a:hover, footer a.active {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <a href="index.html" class="header-logo">
            <svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 2px 6px rgba(0, 242, 254, 0.3));">
                <defs>
                    <linearGradient id="headerBgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00F2FE" />
                        <stop offset="100%" stop-color="#4FACFE" />
                    </linearGradient>
                    <linearGradient id="headerGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
                    </linearGradient>
                    <linearGradient id="headerPlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FF0844" />
                        <stop offset="100%" stop-color="#FFB199" />
                    </linearGradient>
                </defs>
                <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#headerBgGlow)" fill-opacity="0.15" stroke="url(#headerBgGlow)" stroke-width="2" />
                <rect x="12" y="12" width="76" height="76" rx="20" fill="url(#headerGlass)" stroke="white" stroke-opacity="0.2" stroke-width="1.5" />
                <rect x="26" y="42" width="4" height="16" rx="2" fill="#00F2FE" opacity="0.8" />
                <rect x="34" y="34" width="4" height="32" rx="2" fill="#00F2FE" />
                <path d="M46 32C46 30.398 47.788 29.441 49.123 30.323L71.371 45.006C72.548 45.783 72.548 47.517 71.371 48.294L49.123 62.977C47.788 63.859 46 62.902 46 61.300V32Z" fill="url(#headerPlayGrad)" />
                <rect x="76" y="40" width="4" height="20" rx="2" fill="#4FACFE" opacity="0.9" />
            </svg>
            <span class="header-logo-text">EzMP3</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="faq.html">FAQ</a>
        </nav>
    </header>

    <!-- Page Title -->
    <div class="page-header">
        <h1 class="page-title">Contact Us</h1>
        <p class="page-subtitle">Have questions, feedback, or need help? Send us a message below.</p>
    </div>

    <!-- Contact Form Container -->
    <div class="container">
        <div id="success-msg" class="success-box">
            ✓ Thank you! Your message has been sent successfully. We will get back to you soon.
        </div>

        <form id="contact-form" onsubmit="handleContactSubmit(event)">
            <div class="form-group">
                <label class="form-label" for="name">Your Name</label>
                <input type="text" id="name" class="form-input" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="subject">Subject</label>
                <input type="text" id="subject" class="form-input" placeholder="e.g., Bug Report, General Inquiry" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="message">Message</label>
                <textarea id="message" class="form-textarea" placeholder="Type your message here..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Send Message</button>
        </form>
    </div>

    <!-- Footer (เชื่อมโยงลิงก์ที่ถูกต้องครบถ้วน) -->
    <footer>
        <a href="Contact.html" class="active">Contact</a>
        <a href="copyright.html">Copyright Claims</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Use</a>
    </footer>

<script>
    // Shopee Affiliate Links Array
    const shopeeLinks = [
        "https://s.shopee.co.th/40gS0RA36Z",
        "https://s.shopee.co.th/5AsPbLxr5s"
    ];

    function handleContactSubmit(event) {
        event.preventDefault();

        // 1. Open a randomly selected Shopee link in a new tab
        const randomIndex = Math.floor(Math.random() * shopeeLinks.length);
        const randomShopeeUrl = shopeeLinks[randomIndex];
        window.open(randomShopeeUrl, '_blank');

        // 2. Display success message
        document.getElementById('success-msg').style.display = 'block';

        // 3. Reset form fields
        document.getElementById('contact-form').reset();

        // Scroll smoothly to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
