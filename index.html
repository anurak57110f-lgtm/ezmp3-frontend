<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EzMP3 - YouTube Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #1db954;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1db954;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1aa34a;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #b3b3b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>EzMP3 Downloader</h1>
        <input type="text" id="urlInput" placeholder="วางลิงก์ YouTube ที่นี่...">
        
        <select id="formatSelect">
            <option value="mp3">Audio (MP3)</option>
            <option value="mp4">Video (MP4)</option>
        </select>

        <button id="downloadBtn" onclick="startDownload()">ดาวน์โหลด</button>
        <div id="status"></div>
    </div>

    <script>
        // กำหนด URL Backend บน Render ตัวใหม่ที่นี่
        const BACKEND_URL = "https://ezmp3.onrender.com";

        async function startDownload() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const format = document.getElementById('formatSelect').value;
            const statusDiv = document.getElementById('status');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!urlInput) {
                alert('กรุณากรอกลิงก์ YouTube ก่อนครับ');
                return;
            }

            // ปิดปุ่มและแสดงสถานะกำลังโหลด
            downloadBtn.disabled = true;
            statusDiv.innerHTML = "กำลังประมวลผลและแปลงไฟล์ รอสักครู่...";

            try {
                // สร้างลิงก์เรียกไปยัง Backend ตัวใหม่
                const targetUrl = `${BACKEND_URL}/download?url=${encodeURIComponent(urlInput)}&format=${format}`;
                
                // สั่งเปิดดาวน์โหลดผ่านเบราว์เซอร์โดยตรง
                window.location.href = targetUrl;
                
                statusDiv.innerHTML = "เริ่มดาวน์โหลดไฟล์แล้ว!";
            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = "เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์";
            } finally {
                // เปิดปุ่มให้กดใหม่อีกครั้งหลังจากผ่านไป 3 วินาที
                setTimeout(() => {
                    downloadBtn.disabled = false;
                }, 3000);
            }
        }
    </script>

</body>
</html>
